name: HRAvatar
# -------------------------------------------------------------------------
# Python 3.11 + PyTorch 2.9.1 + CUDA 12.8 environment for HRAvatar.
# -------------------------------------------------------------------------
# Pin set aligned with the companion MTamon "cuda128" branches:
#   - https://github.com/MTamon/DECA   (release/cuda128, install_128.sh)
#   - https://github.com/MTamon/smirk  (release/cuda128, install_128.sh)
#   - https://github.com/MTamon/FLARE  (main,            build_environment.sh)
#
# DECA and SMIRK branches are mutually version-consistent and we follow
# their install_128.sh pin set verbatim where possible.  FLARE pins a
# slightly different set (torch 2.9.0 / mediapipe 0.10.11 / protobuf 3.20.3)
# that is *incompatible* with SMIRK, so we chose the DECA/SMIRK set because
# HRAvatar needs SMIRK's checkpoint-compatible SMIRK_em1.pt layer names.
#
# Deviations from MTamon references that apply ONLY here:
#   (1) pyshtools 4.13.1 stays pinned (HRAvatar uses it from utils/sh_utils.py
#       for SH rotation in filter_envmap; not present in the three sibling
#       repos).  pyshtools 4.13.1 publishes numpy-2 compatible wheels.
#   (2) pytorch3d is built from source (@v0.7.8) — the three sibling repos
#       do not ship pytorch3d; HRAvatar needs `pytorch3d.ops` at runtime.
#   (3) nvdiffrast is installed from NVlabs HEAD (no PyPI wheel for cu128).
#   (4) A minimal set of HRAvatar-only deps (plyfile, pyshtools, roma,
#       carvekit-colab, diffusers, taming-transformers fork, openai CLIP)
#       is appended after the shared pin block.
# All install steps use `pip install --no-deps` to reproduce the MTamon
# behaviour; see setup.sh for the ordered installer.
# -------------------------------------------------------------------------
channels:
  - pytorch
  - nvidia/label/cuda-12.8.0
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip=25.2
  - ninja
  - cmake
  - gcc_linux-64=11
  - gxx_linux-64=11
  - cuda-toolkit=12.8
  - ffmpeg>=6.0
  # All Python packages are installed via setup.sh (ordered, --no-deps)
  # so they are not repeated in environment.yml.  This keeps the conda
  # resolver from re-pinning anything.
